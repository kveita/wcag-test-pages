<body>
    <h1>WCAG Test Page 158</h1>
    <p>This page contains accessibility violations for testing.</p>
    <div class="contrast-red-on-red">Red text on red background</div>
    <div class="contrast-gray-on-white">Gray text on white background</div>
    <div class="color-only">
        <div class="color-pill neutral">Neutral</div>
        <div class="color-pill go">Go</div>
        <div class="color-pill stop">Stop</div>
    </div>
    
    <a href="#" class="link-placeholder">Click here for more info</a>
    
    <script>
        window.__wcag_test_page = {
            violations: [
                {"type": "Table", "desc": "Table has width='100%' and content is squished, breaking readability", "wcag": ["1.4.10"], "fix": "Remove fixed width or allow content wrapping."},
                {"type": "Form", "desc": "Input field with no associated label or aria-label", "wcag": ["1.1.1", "4.1.2"], "fix": "Add <label> or aria-label='Search products'."},
                {"type": "Color-Only", "desc": "Action buttons use only red vs green to distinguish, no icon or text label", "wcag": ["1.4.1"], "fix": "Add text labels like 'Delete'/'Save' or icons alongside colors."},
                {"type": "Scrolling", "desc": "Large page with tiny in-page navigation links (under 44x44px)", "wcag": ["2.5.5"], "fix": "Increase clickable areas to at least 44x44 CSS px."},
                {"type": "Media", "desc": "Autoplayed sound is purely decorative but cannot be stopped", "wcag": ["1.4.2"], "fix": "Stop the sound or let users disable it."}
            ]
        };
    </script>
